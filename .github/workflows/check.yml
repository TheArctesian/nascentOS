name: Source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # All-system evaluation exceeds hosted-runner RAM; without swap the runner is OOM-killed.
      - name: Add evaluation memory headroom on this disposable runner
        run: |
          test ! -e /mnt/nascent-check.swap
          sudo fallocate -l 24G /mnt/nascent-check.swap
          sudo chmod 600 /mnt/nascent-check.swap
          sudo mkswap /mnt/nascent-check.swap
          sudo swapon /mnt/nascent-check.swap
          free -h
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Release support unit tests and workflow lint
        run: ./release-support/verify
      - name: Formatting, all-system evaluation and native CLI tests
        run: ./release-support/memory-watch ./scripts/check
