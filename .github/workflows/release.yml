name: Release candidate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      create_draft:
        description: Create a draft GitHub Release after builds and boot tests
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 release-support/resolve.py "$TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    # Dedicated disposable Linux builders; never run PR code on these machines.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: X64
            system: x86_64-linux
          - arch: ARM64
            system: aarch64-linux
    runs-on: [self-hosted, Linux, '${{ matrix.arch }}', nascent-release]
    timeout-minutes: 360
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Check native Nix, capacity and KVM build capability
        env:
          SYSTEM: ${{ matrix.system }}
        run: ./release-support/preflight "$SYSTEM"
      - name: Release support checks
        run: ./release-support/verify
      - name: Formatting, evaluation and native CLI tests
        run: ./scripts/check
      - name: Build configuration and profile assertion checks
        env:
          SYSTEM: ${{ matrix.system }}
        run: nix build -L --no-link ".#checks.$SYSTEM.installer" ".#checks.$SYSTEM.profiles"
      - name: Build native VM and graphical installer ISO
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix build -L ".#packages.$SYSTEM.vm" --out-link result-vm
          nix build -L ".#packages.$SYSTEM.installer" --out-link result-installer
      - name: Execute native NixOS boot test (not graphical installation)
        run: ./scripts/test-vm
      - name: Package candidate only after all automated gates pass
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REVISION: ${{ needs.resolve.outputs.revision }}
          SYSTEM: ${{ matrix.system }}
        run: |
          git diff --exit-code HEAD -- flake.lock
          python3 release-support/package.py --tag "$TAG" --revision "$REVISION" \
            --system "$SYSTEM" --iso-dir result-installer/iso --lock flake.lock \
            --store-path "$(readlink -f result-installer)" --output candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.system }}
          path: candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-*
          merge-multiple: true
          path: candidate
      - name: Verify candidate integrity and write release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: python3 release-support/verify-candidate.py candidate "$TAG" "$REVISION"
      - name: Create draft only; existing releases are never overwritten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$REVISION"
          gh release create "$TAG" candidate/* --verify-tag --draft \
            --title "nascentOS $TAG (candidate)" --notes-file release-notes.md
