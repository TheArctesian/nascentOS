name: Build and publish installer ISOs
on:
  push:
    branches: [main]
    # Docs-only pushes don't change the image; skip the build (the count still advances).
    paths-ignore: ['**.md', 'docs/**', 'installer-design/previews/**']
  workflow_dispatch:
permissions:
  contents: read
# One publish at a time; a newer push replaces any queued (not running) build.
concurrency:
  group: iso-main
  cancel-in-progress: false
env:
  R2_BUCKET: nascentos-iso
  R2_PUBLIC_URL: https://iso.stephenokita.com
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-linux
            runner: ubuntu-24.04
    # Either architecture may fail; the publisher only advertises bundles that exist.
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      SYSTEM: ${{ matrix.system }}
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        max-jobs = 2
        cores = 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # The version is the first-parent commit count.
          persist-credentials: false
      - id: source
        run: python3 release-support/version.py HEAD >> "$GITHUB_OUTPUT"
      - name: Reclaim unused toolchains on this disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Add evaluation memory headroom on this disposable runner
        run: |
          test ! -e /mnt/nascent-release.swap
          sudo fallocate -l 24G /mnt/nascent-release.swap
          sudo chmod 600 /mnt/nascent-release.swap
          sudo mkswap /mnt/nascent-release.swap
          sudo swapon /mnt/nascent-release.swap
          free -h
          df -h / /mnt
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 4
      - name: Check native architecture and available space
        run: ./release-support/preflight "$SYSTEM"
      - name: Release support checks and workflow lint
        run: ./release-support/verify
      - name: Source, CLI and configuration/profile checks
        run: |
          ./release-support/memory-watch ./scripts/check
          ./release-support/memory-watch nix build -L --no-link ".#checks.$SYSTEM.installer" ".#checks.$SYSTEM.profiles"
      - name: Build normal production ISO (not installer-dev)
        run: |
          ./release-support/memory-watch nix build -L --no-update-lock-file ".#packages.$SYSTEM.installer" --out-link result-installer
          git diff --exit-code HEAD -- flake.lock
      - name: Optional native boot test when this runner actually exposes KVM
        id: boot
        run: |
          if [[ -c /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            echo 'extra-system-features = kvm' | sudo tee -a /etc/nix/nix.conf
            sudo systemctl restart nix-daemon.service
            nix build -L --no-link ".#checks.$SYSTEM.boot"
            echo 'status=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'No /dev/kvm; native boot test not run. This is recorded in the release manifest.'
            echo 'status=not-run' >> "$GITHUB_OUTPUT"
          fi
      - name: Remove unreferenced build dependencies before packaging
        run: nix-collect-garbage
      - name: Package checksums, source lock and bounded ISO parts
        env:
          TAG: ${{ steps.source.outputs.tag }}
          REVISION: ${{ steps.source.outputs.revision }}
          BOOT_STATUS: ${{ steps.boot.outputs.status }}
        run: |
          python3 release-support/package.py --tag "$TAG" --revision "$REVISION" \
            --system "$SYSTEM" --iso-dir result-installer/iso --lock flake.lock \
            --store-path "$(readlink -f result-installer)" --nixos-boot "$BOOT_STATUS" --output candidate
          python3 release-support/verify-candidate.py candidate "$TAG" "$REVISION" --systems "$SYSTEM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.system }}
          path: candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    needs: build
    # Only main may publish; a manual run on another branch would reuse main's version numbers.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-*
          merge-multiple: true
          path: candidate
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify exact source and every built image
        id: verify
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          systems=()
          for system in aarch64-linux x86_64-linux; do
            if [[ -f candidate/nascentos-$TAG-$system.manifest.json ]]; then systems+=("$system"); fi
          done
          if (( ${#systems[@]} == 0 )); then echo 'No architecture built; nothing to publish.' >&2; exit 1; fi
          python3 release-support/verify-candidate.py candidate "$TAG" "$REVISION" \
            --systems "${systems[@]}" --base-url "$R2_PUBLIC_URL"
          cp release-notes.md candidate/NOTES.md
          echo "systems=${systems[*]}" >> "$GITHUB_OUTPUT"
      - name: Upload to R2 and advance latest
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SYSTEMS: ${{ steps.verify.outputs.systems }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          read -ra systems <<< "$SYSTEMS"
          nix shell --inputs-from . nixpkgs#rclone -c ./release-support/publish-r2 candidate "$TAG" "${systems[@]}"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
