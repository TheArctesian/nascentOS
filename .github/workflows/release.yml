name: Build and publish installer ISOs
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-linux
            runner: ubuntu-24.04
    # ARM is required; an x86 failure must not advertise an unbuilt x86 image.
    continue-on-error: ${{ matrix.system == 'x86_64-linux' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      SYSTEM: ${{ matrix.system }}
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        max-jobs = 2
        cores = 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 release-support/resolve.py "$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - name: Reclaim unused toolchains on this disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Add evaluation memory headroom on this disposable runner
        run: |
          test ! -e /mnt/nascent-release.swap
          sudo fallocate -l 24G /mnt/nascent-release.swap
          sudo chmod 600 /mnt/nascent-release.swap
          sudo mkswap /mnt/nascent-release.swap
          sudo swapon /mnt/nascent-release.swap
          free -h
          df -h / /mnt
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 4
      - name: Check native architecture and available space
        run: ./release-support/preflight "$SYSTEM"
      - name: Release support checks and workflow lint
        run: ./release-support/verify
      - name: Source, CLI and configuration/profile checks
        run: |
          ./scripts/check
          nix build -L --no-link ".#checks.$SYSTEM.installer" ".#checks.$SYSTEM.profiles"
      - name: Build normal production ISO (not installer-dev)
        run: |
          nix build -L --no-update-lock-file ".#packages.$SYSTEM.installer" --out-link result-installer
          git diff --exit-code HEAD -- flake.lock
      - name: Optional native boot test when this runner actually exposes KVM
        id: boot
        run: |
          if [[ -c /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            echo 'extra-system-features = kvm' | sudo tee -a /etc/nix/nix.conf
            sudo systemctl restart nix-daemon.service
            nix build -L --no-link ".#checks.$SYSTEM.boot"
            echo 'status=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'No /dev/kvm; native boot test not run. This is recorded in the release manifest.'
            echo 'status=not-run' >> "$GITHUB_OUTPUT"
          fi
      - name: Remove unreferenced build dependencies before packaging
        run: nix-collect-garbage
      - name: Package checksums, source lock and bounded ISO parts
        env:
          TAG: ${{ steps.source.outputs.tag }}
          REVISION: ${{ steps.source.outputs.revision }}
          BOOT_STATUS: ${{ steps.boot.outputs.status }}
        run: |
          python3 release-support/package.py --tag "$TAG" --revision "$REVISION" \
            --system "$SYSTEM" --iso-dir result-installer/iso --lock flake.lock \
            --store-path "$(readlink -f result-installer)" --nixos-boot "$BOOT_STATUS" --output candidate
          python3 release-support/verify-candidate.py candidate "$TAG" "$REVISION" --systems "$SYSTEM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.system }}
          path: candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-*
          merge-multiple: true
          path: candidate
      - name: Verify exact source and all image parts
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          systems=(aarch64-linux)
          if [[ -f candidate/nascentos-$TAG-x86_64-linux.manifest.json ]]; then systems+=(x86_64-linux); fi
          python3 release-support/verify-candidate.py candidate "$TAG" "$REVISION" --systems "${systems[@]}"
      - name: Upload, verify GitHub asset digests and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$REVISION"
          gh release create "$TAG" --verify-tag --draft --prerelease \
            --title "nascentOS $TAG — installer preview" --notes-file release-notes.md
          gh release upload "$TAG" candidate/*
          # Drafts are not returned by the REST get-release-by-tag endpoint.
          release_api=$(gh release view "$TAG" --json apiUrl --jq .apiUrl)
          gh api "$release_api" > uploaded-release.json
          python3 release-support/verify-remote.py candidate uploaded-release.json
          gh release edit "$TAG" --draft=false --prerelease --latest=false
